name: Secure Filtered Google Drive Sync

on:
  push:
    branches:
      - main # Change this if your primary research branch name is different

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Install Rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure and Execute Sync
        env:
          GDRIVE_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: "12cIsrCochQvQE3zCurgseW4beGD6RdMZ" # Replace with your real folder ID
        run: |
          # 1. RUN YOUR EXACT WORKING BASE64 DECODER INTO AN ENVIRONMENT VARIABLE
          RAW_CLEAN_JSON=$(python3 -c '
          import os, base64, json
          base64_str = os.environ["GDRIVE_JSON"]
          decoded_bytes = base64.b64decode(base64_str)
          decoded_secret = decoded_bytes.decode("utf-8")
          decoded = json.loads(decoded_secret)
          print(json.dumps(decoded))
          ')

          # 2. WRITE TO THE RCLONE CONFIG PROFILE
          mkdir -p ~/.config/rclone
          cat << EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          service_account_credentials = $RAW_CLEAN_JSON
          root_folder_id = ${{ env.DRIVE_FOLDER_ID }}
          EOF

          echo "Rclone profile cleanly mapped in system memory!"

          # 3. RUN NATIVE CLOUD SYNC WITH EXPLICIT OWNER POOL ROUTING
          rclone sync . gdrive: \
            --include "*.md" \
            --include "*.txt" \
            --include "*.json" \
            --include "*.pdf" \
            --include "*.tex" \
            --include "*.cff" \
            --include "*.png" \
            --include "*.bib" \
            --include "*.py" \
            --include "*.ipynb" \
            --exclude ".git/**" \
            --exclude ".github/**" \
            --drive-upload-cutoff 0 \
            --drive-acknowledge-abuse \
            --drive-keep-revision-forever=false \
            --drive-use-trash=false \
            --verbose

          # 4. PURGE THE ACTIVE PROFILE CONFIG FROM MEMORY DISK IMMEDIATELY
          rm -rf ~/.config/rclone
          echo "Automation complete. Security profiles shredded."
