name: Secure Filtered Google Drive Sync

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google API Client
        run: |
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Execute Filtered Cloud Sync
        env:
          GDRIVE_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          # 1. Double check your long folder ID here:
          DRIVE_FOLDER_ID: "12cIsrCochQvQE3zCurgseW4beGD6RdMZ"
          ALLOWED_EXTENSIONS: ".md,.txt,.json,.pdf,.tex,.cff,.png,.bib,.py,.ipynb"
        run: |
          cat << 'EOF' > sync_script.py
          import os
          import json
          import base64
          import io
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.auth.transport.requests import Request

          # 1. Parse Environments
          allowed_exts = tuple(os.environ['ALLOWED_EXTENSIONS'].split(','))
          root_folder_id = os.environ['DRIVE_FOLDER_ID']
          
          # 2. Authenticate completely in system memory (Zero temporary files)
          base64_str = os.environ['GDRIVE_JSON']
          
          # Decode the base64 string back into standard text bytes, then decode to UTF-8
          decoded_bytes = base64.b64decode(base64_str)
          decoded_secret = decoded_bytes.decode('utf-8')
          
          # NOW it is safe to parse it as JSON
          decoded = json.loads(decoded_secret)
          
          print(f"Number of items in decoded: {len(decoded)}")
          
          # Note: Use the full Google Drive scope if you are interacting with Drive files
          SCOPES = ['https://www.googleapis.com/auth/drive']
          creds = service_account.Credentials.from_service_account_info(
              decoded, scopes=SCOPES
          )
          
          creds.refresh(Request())
          print("Successfully Refreshed!")
          
          drive_service = build('drive', 'v3', credentials=creds)
          print("Successfully authenticated with Google Drive!")

          print("STARTING CLONE FROM GIT->DRIVE")

          # Helper to manage remote Drive folders synchronously to prevent duplicates
          def get_or_create_drive_folder(name, parent_id):
              query = f"name='{name}' and '{parent_id}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false"
              results = drive_service.files().list(q=query, fields="files(id)", supportsAllDrives=True, includeItemsFromAllDrives=True).execute()
              files = results.get('files', [])
              if files:
                  return files[0]['id']
              
              folder_metadata = {
                  'name': name,
                  'mimeType': 'application/vnd.google-apps.folder',
                  'parents': [parent_id]
              }
              folder = drive_service.files().create(body=folder_metadata, fields='id', supportsAllDrives=True).execute()
              return folder.get('id')

          # Helper to clear or overwrite an existing file cleanly
          def upload_or_update_file(local_path, filename, parent_id):
              query = f"name='{filename}' and '{parent_id}' in parents and trashed=false"
              results = drive_service.files().list(q=query, fields="files(id)", supportsAllDrives=True, includeItemsFromAllDrives=True).execute()
              files = results.get('files', [])
              
              # Read file directly into system memory to bypass the 0GB service account storage limit
              with open(local_path, 'rb') as f:
                  file_bytes = f.read()
              
              # Fixed: Using standard non-deprecated memory stream wrapper
              fh = io.BytesIO(file_bytes)
              media = MediaIoBaseUpload(fh, mimetype='application/octet-stream', resumable=False)
              
              if files:
                  # File exists, perform an explicit targeted update
                  file_id = files[0]['id']
                  drive_service.files().update(fileId=file_id, media_body=media, supportsAllDrives=True).execute()
                  print(f"Updated: {filename}")
              else:
                  file_metadata = {
                      'name': filename, 
                      'parents': [parent_id]
                  }
                  # Create the file via memory allocation directly to your shared drive folder
                  drive_service.files().create(
                      body=file_metadata, 
                      media_body=media, 
                      fields='id', 
                      supportsAllDrives=True
                  ).execute()
                  print(f"Uploaded: {filename}")

          # Dictionary mapping path strings to their respective Google Drive Folder IDs
          folder_cache = {'.': root_folder_id}

          # 3. Securely crawl and push allowed items while retaining folder architecture
          for root, dirs, files in os.walk('.'):
              # Skip git tracking, action workflows, and hidden system artifacts entirely
              if '.git' in root or '.github' in root:
                  continue
                  
              # Resolve current remote folder ID
              rel_path = os.path.relpath(root, '.')
              if rel_path == '.':
                  current_parent_id = root_folder_id
              else:
                  parent_rel = os.path.dirname(rel_path)
                  folder_name = os.path.basename(rel_path)
                  parent_drive_id = folder_cache[parent_rel]
                  current_parent_id = get_or_create_drive_folder(folder_name, parent_drive_id)
                  folder_cache[rel_path] = current_parent_id

              for file in files:
                  if file.lower().endswith(allowed_exts):
                      local_file_path = os.path.join(root, file)
                      upload_or_update_file(local_file_path, file, current_parent_id)

          print("COMPLETED CLONE FROM GIT->DRIVE")
          
          EOF
          python sync_script.py
